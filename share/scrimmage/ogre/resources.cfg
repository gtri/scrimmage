# Ogre3D Resources Configuration for SCRIMMAGE
#
# This file defines where Ogre3D should look for resources such as
# meshes, materials, textures, and scripts.

[General]
# Core Ogre resources (RTShader system, etc.)
FileSystem=/usr/share/OGRE/Media
FileSystem=/usr/share/OGRE/Media/RTShaderLib
FileSystem=/usr/share/OGRE/Media/RTShaderLib/GLSL
FileSystem=/usr/share/OGRE/Media/RTShaderLib/materials
FileSystem=/usr/share/OGRE/Media/materials/scripts
FileSystem=/usr/share/OGRE/Media/materials/textures

# SCRIMMAGE-specific resources
# These paths will be set relative to the install prefix
