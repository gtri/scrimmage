# Ogre3D Plugins Configuration for SCRIMMAGE
#
# This file defines which Ogre3D plugins to load at startup.

# Plugin directory (Ubuntu/Debian default)
PluginFolder=/usr/lib/aarch64-linux-gnu/OGRE

# Core render system plugins
Plugin=RenderSystem_GL3Plus

# Scene manager plugins
Plugin=Plugin_ParticleFX
Plugin=Plugin_OctreeSceneManager

# Additional plugins (optional)
# Plugin=Plugin_BSPSceneManager
# Plugin=Plugin_DotScene
