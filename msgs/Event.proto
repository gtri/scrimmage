syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.gtri.scrimmage";

import "scrimmage/proto/State.proto";

package scrimmage_msgs;

message EndTime {
}

message OneTeamPresent {
        int32 team_id = 1;
}

message NoTeamsPresent {
}

message EntityPresentAtEnd {
        int32 entity_id = 1;
}

message UserForcedExit {
}

message EntityGenerated {
        int32 entity_id = 1;
}

message EntityRemoved {
        int32 entity_id = 1;
}

message EntityInteractionExit {
}

message KeyValuePair {
        string key = 1;
        string value = 2;
}

message PluginParamOverride {
        string plugin_type = 1;
        uint32 plugin_index = 2;
        repeated KeyValuePair params = 3;
        optional string plugin_name = 4; // name will resolve to a plugin_index
}

message GenerateEntity {
        string entity_tag = 1;
        scrimmage_proto.State state = 2;
        int32 entity_id = 4;
        repeated PluginParamOverride plugin_override = 5;
}
