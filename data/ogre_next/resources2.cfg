# OGRE-Next resource configuration for Scrimmage
# 
# IMPORTANT: The [Hlms] section's DoNotUseAsResource entry specifies
# the PARENT folder that CONTAINS the Hlms/ directory.
# The HLMS getDefaultPaths() returns paths like "Hlms/Unlit/GLSL" 
# so this value should NOT include "Hlms/" itself.

[Hlms]
DoNotUseAsResource=./

[General]
# Add custom materials, meshes, textures here as needed
# FileSystem=Materials
# FileSystem=Meshes
# FileSystem=Textures
